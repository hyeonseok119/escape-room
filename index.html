<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공테가이드</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0a0a0a;
      color: #e0e0e0;
      font-family: 'Noto Serif KR', serif;
    }

    /* 스폰서 배너 */
    .sponsor-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: #1a0000;
      border-bottom: 1px solid #ff0000;
      text-align: center;
      padding: 8px;
      font-size: 0.85rem;
      color: #ff6666;
      z-index: 999;
    }

    /* 메인 헤더 */
    .hero {
      margin-top: 36px;
      padding: 60px 16px 40px;
      text-align: center;
      background: linear-gradient(180deg, #1a0000 0%, #0a0a0a 100%);
      border-bottom: 1px solid #3a0000;
    }

    .hero-subtitle {
      font-size: 0.85rem;
      letter-spacing: 6px;
      color: #ff0000;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .hero-title {
      font-size: 3rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 20px #ff000088, 0 0 40px #ff000044;
      letter-spacing: 4px;
      line-height: 1.2;
    }

    .hero-title span {
      color: #ff0000;
    }

    .hero-desc {
      margin-top: 16px;
      font-size: 0.9rem;
      color: #888888;
      letter-spacing: 2px;
    }

    /* 필터 */
    .filter-section {
      padding: 24px 16px;
      max-width: 900px;
      margin: 0 auto;
    }

    .filter-group {
      margin-bottom: 16px;
    }

    .filter-label {
      font-size: 0.8rem;
      color: #ff0000;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn {
      padding: 6px 14px;
      border: 1px solid #3a0000;
      border-radius: 20px;
      background-color: #1a0000;
      color: #aaaaaa;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Noto Serif KR', serif;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background-color: #ff0000;
      border-color: #ff0000;
      color: #ffffff;
    }

    /* 테마 카드 그리드 */
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 16px 60px;
    }

    @media (min-width: 600px) {
      .theme-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (min-width: 900px) {
      .theme-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .theme-card {
      background-color: #111111;
      border: 1px solid #2a0000;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }

    .theme-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(255, 0, 0, 0.3);
      border-color: #ff0000;
    }

    .theme-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
    }

    .theme-card-body {
      padding: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .theme-card-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: #ffffff;
    }

    .theme-card-store {
      font-size: 0.75rem;
      color: #888888;
    }

    .theme-card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .theme-card-region {
      font-size: 0.72rem;
      background-color: #1a0000;
      color: #ff6666;
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid #3a0000;
    }

    .horror-level {
      font-size: 0.8rem;
      letter-spacing: 1px;
    }

    .reserve-btn {
      display: block;
      margin-top: 10px;
      padding: 8px;
      background-color: #1a0000;
      border: 1px solid #ff0000;
      border-radius: 6px;
      color: #ff0000;
      text-align: center;
      font-size: 0.82rem;
      text-decoration: none;
      transition: background-color 0.2s, color 0.2s;
      font-family: 'Noto Serif KR', serif;
    }

    .reserve-btn:hover {
      background-color: #ff0000;
      color: #ffffff;
    }

    .no-result {
      grid-column: 1 / -1;
      text-align: center;
      color: #555555;
      padding: 60px 0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- 스폰서 배너 -->
  <div class="sponsor-bar">
    📢 이 자리는 스폰서 광고 배너입니다
  </div>

  <!-- 메인 헤더 -->
  <div class="hero">
    <div class="hero-subtitle">— HORROR THEME GUIDE —</div>
    <div class="hero-title">공<span>테</span>가이드</div>
    <div class="hero-desc">당신이 두려워할 공포 방탈출 테마를 찾아드립니다</div>
  </div>

  <!-- 필터 -->
  <div class="filter-section">
    <div class="filter-group">
      <div class="filter-label">📍 지역</div>
      <div class="filter-buttons" id="regionFilter">
        <button class="filter-btn active" onclick="setFilter('region', '전체', this)">전체</button>
        <button class="filter-btn" onclick="setFilter('region', '강남', this)">강남</button>
        <button class="filter-btn" onclick="setFilter('region', '홍대', this)">홍대</button>
        <button class="filter-btn" onclick="setFilter('region', '건대', this)">건대</button>
        <button class="filter-btn" onclick="setFilter('region', '대학로', this)">대학로</button>
        <button class="filter-btn" onclick="setFilter('region', '잠실', this)">잠실</button>
        <button class="filter-btn" onclick="setFilter('region', '인천', this)">인천</button>
        <button class="filter-btn" onclick="setFilter('region', '수원', this)">수원</button>
        <button class="filter-btn" onclick="setFilter('region', '안산', this)">안산</button>
        <button class="filter-btn" onclick="setFilter('region', '안양', this)">안양</button>
      </div>
    </div>

    <div class="filter-group">
      <div class="filter-label">👻 공포도</div>
      <div class="filter-buttons" id="horrorFilter">
        <button class="filter-btn active" onclick="setFilter('horror', '전체', this)">전체</button>
        <button class="filter-btn" onclick="setFilter('horror', 1, this)">💀 1단계</button>
        <button class="filter-btn" onclick="setFilter('horror', 2, this)">💀💀 2단계</button>
        <button class="filter-btn" onclick="setFilter('horror', 3, this)">💀💀💀 3단계</button>
        <button class="filter-btn" onclick="setFilter('horror', 4, this)">💀💀💀💀 4단계</button>
        <button class="filter-btn" onclick="setFilter('horror', 5, this)">💀💀💀💀💀 5단계</button>
      </div>
    </div>
  </div>

  <!-- 테마 카드 그리드 -->
  <div class="theme-grid" id="themeGrid"></div>

  <script>
    const themes = [
      {
        name: 'NOX',
        store: '제로월드 홍대점',
        region: '홍대',
        horror: 4,
        img: 'https://zerohongdae.com/storage/lwGpXRwNnpUlFVWKcZQzfK8wMeC6gQ4gjYnTCndw.png',
        url: 'https://zerohongdae.com/reservation'
      },
      {
        name: '층간소음',
        store: '제로월드 홍대점',
        region: '홍대',
        horror: 3,
        img: 'https://zerohongdae.com/storage/m09Dw0A46eZbIlxCKOgXcp5b02QB6UmfrSTzAtbi.jpg',
        url: 'https://zerohongdae.com/reservation'
      },
      {
        name: '깜방탈출 : WAY OUT',
        store: '제로월드 홍대점',
        region: '홍대',
        horror: 2,
        img: 'https://zerohongdae.com/storage/04dAAb57MJKD0poJ4VnlsJIL9EDWrYMzq6hTCRYi.jpg',
        url: 'https://zerohongdae.com/reservation'
      },
      {
        name: '사랑...하는...감?',
        store: '제로월드 홍대점',
        region: '홍대',
        horror: 3,
        img: 'https://zerohongdae.com/storage/NZSXGtMhy5Rod5fwRFqpP9edW6ggmNvFSAytmlDP.jpg',
        url: 'https://zerohongdae.com/reservation'
      },
      {
        name: 'ALIVE',
        store: '제로월드 홍대점',
        region: '홍대',
        horror: 5,
        img: 'https://zerohongdae.com/storage/9ibzZ5mUK63r5DvwjODh9e64heWXtFG8rxFili3P.jpg',
        url: 'https://zerohongdae.com/reservation'
      },
      {
        name: '쓰여진 문장 속에 구원이 없다면',
        store: '단편선 성수',
        region: '강남',
        horror: 2,
        img: 'https://cdn.imweb.me/thumbnail/20240425/a5df26f311549.png',
        url: 'https://dpsnnn-s.imweb.me/reserve_ss'
      },
      {
        name: '존재할 자격',
        store: '단편선 성수',
        region: '강남',
        horror: 3,
        img: 'https://cdn.imweb.me/thumbnail/20240425/4b91bd6f19d9d.png',
        url: 'https://dpsnnn-s.imweb.me/reserve_ss'
      },
      {
        name: '쥐와 파시스트와 마지막 한 장',
        store: '단편선 성수',
        region: '강남',
        horror: 2,
        img: 'https://cdn.imweb.me/thumbnail/20240623/0b00a78ea96e7.jpg',
        url: 'https://dpsnnn-s.imweb.me/reserve_ss'
      },
      {
        name: '뱃사람의 별',
        store: '단편선 성수',
        region: '강남',
        horror: 3,
        img: 'https://cdn.imweb.me/thumbnail/20240425/8b8cf215fd5ac.jpeg',
        url: 'https://dpsnnn-s.imweb.me/reserve_ss'
      },
    ];

    let currentRegion = '전체';
    let currentHorror = '전체';

    function horrorEmoji(level) {
      return '💀'.repeat(level);
    }

    function renderThemes() {
      const grid = document.getElementById('themeGrid');
      const filtered = themes.filter(t => {
        const regionMatch = currentRegion === '전체' || t.region === currentRegion;
        const horrorMatch = currentHorror === '전체' || t.horror === currentHorror;
        return regionMatch && horrorMatch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="no-result">😶 해당 조건의 테마가 없어요</div>';
        return;
      }

      grid.innerHTML = filtered.map(t => `
        <div class="theme-card">
          <img src="${t.img}" alt="${t.name}">
          <div class="theme-card-body">
            <div class="theme-card-name">${t.name}</div>
            <div class="theme-card-store">${t.store}</div>
            <div class="theme-card-meta">
              <span class="theme-card-region">${t.region}</span>
              <span class="horror-level">${horrorEmoji(t.horror)}</span>
            </div>
            <a class="reserve-btn" href="${t.url}" target="_blank">예약하기</a>
          </div>
        </div>
      `).join('');
    }

    function setFilter(type, value, btn) {
      if (type === 'region') {
        currentRegion = value;
        document.querySelectorAll('#regionFilter .filter-btn').forEach(b => b.classList.remove('active'));
      } else {
        currentHorror = value;
        document.querySelectorAll('#horrorFilter .filter-btn').forEach(b => b.classList.remove('active'));
      }
      btn.classList.add('active');
      renderThemes();
    }

    renderThemes();
  </script>

</body>
</html>
