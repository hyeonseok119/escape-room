    async function loadThemesFromFirebase() {
      try {
        const snapshot = await getDocs(collection(db, 'themes'));
        snapshot.forEach(doc => {
          const firebaseTheme = doc.data();
          if (!themes.find(t => t.name === firebaseTheme.name)) {
            themes.push(firebaseTheme);
          }
        });
      } catch(e) {
        console.error('Firebase 테마 로드 오류:', e);
      }
    }

    let currentRegions = [];
let currentHorrors = [];
    let ratings = {};

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      
      if (user) {
        await loadUserProfile();
        
        const q = query(collection(db, 'ratings'), where('userId', '==', user.uid));
        const snapshot = await getDocs(q);
        userRatings.clear();
        userRatingsData = [];
        snapshot.forEach(doc => {
          userRatings.add(doc.data().theme);
          userRatingsData.push({ id: doc.id, ...doc.data() });
        });

        const qPosts = query(collection(db, 'posts'), where('userId', '==', user.uid));
        const snapshotPosts = await getDocs(qPosts);
        userPostsData = [];
        snapshotPosts.forEach(doc => {
          userPostsData.push({ id: doc.id, ...doc.data() });
        });
      } else {
        userRatings.clear();
        userRatingsData = [];
        userPostsData = [];
        userProfile = {};
      }
      await loadThemesFromFirebase();
      renderThemes();
      renderMypage();

      return false;
    });

    async function loadUserProfile() {
      if (!currentUser) return;
      
      try {
        const userDocs = await getDocs(query(collection(db, 'userProfiles'), where('userId', '==', currentUser.uid)));
        if (userDocs.size > 0) {
          userProfile = { id: userDocs.docs[0].id, ...userDocs.docs[0].data() };
        } else {
          userProfile = {
            userId: currentUser.uid,
            nickname: currentUser.displayName || '사용자'
          };
        }
      } catch(e) {
        console.error('프로필 로드 오류:', e);
        userProfile = {
          userId: currentUser.uid,
          nickname: currentUser.displayName || '사용자'
        };
      }
    }

    window.handleLogin = async function() {
      try {
        if (currentUser) {
          await signOut(auth);
        } else {
          await signInWithPopup(auth, googleProvider);
        }
      } catch(error) {
        console.error('인증 오류:', error);

    async function loadRatings() {
      const snapshot = await getDocs(collection(db, 'ratings'));
      const temp = {};
      allRatingsData = [];
      
      snapshot.forEach(doc => {
        const d = doc.data();
        allRatingsData.push(d);
        if (!temp[d.theme]) temp[d.theme] = [];
        temp[d.theme].push(d.star);
      });
      
      Object.keys(temp).forEach(k => {
        const arr = temp[k];
        ratings[k] = (arr.reduce((a,b) => a+b, 0) / arr.length).toFixed(1);
      });
      renderThemes();
      renderRanking();
      await loadPosts();
    }

    async function loadPosts() {
      try {
        const snapshot = await getDocs(collection(db, 'posts'));
        allPostsData = [];
        snapshot.forEach(doc => {
          const data = doc.data();
          allPostsData.push({ 
            id: doc.id, 
            ...data,
            createdAt: typeof data.createdAt === 'string' ? new Date(data.createdAt) : data.createdAt
          });
        });
        renderCommunity();
      } catch(e) {
        console.error('포스트 로드 오류:', e);
      }
    }

    async function loadAnnouncements() {

          return dateB - dateA;
        });

      }

function updateActiveFilters() {
  const container = document.getElementById('activeFilters');
  let html = '';
  
  currentRegions.forEach(region => {
    html += `<div class="active-tag">📍 ${region} <button onclick="clearFilter('region', '${region}')">✕</button></div>`;
  });
  
  currentHorrors.forEach(horror => {
    if (!isNaN(horror)) {
      html += `<div class="active-tag">👻 공포도 ${horror} <button onclick="clearFilter('horror', ${horror})">✕</button></div>`;
    }
  });
  
  container.innerHTML = html;
}
    function horrorDisplay(level) {
      const full = Math.floor(level);
      const half = level % 1 !== 0;
      return '💀'.repeat(full) + (half ? '👻' : '') + ` ${level}`;
    }

    window.renderThemes = async function() {
  if (!window.currentThemePage) window.currentThemePage = 1;
  
  // Featured 테마명 로드
  let featuredThemeNames = [];
  let themeOrder = [];
  try {
    const sponsorDocs = await getDocs(query(collection(db, 'settings'), where('type', '==', 'sponsors')));
    if (sponsorDocs.size > 0) {
      const featured = sponsorDocs.docs[0].data().featured;
      const order = sponsorDocs.docs[0].data().order;
      if (featured && Array.isArray(featured)) {
        featuredThemeNames = featured.filter(f => f && f !== '');
        themeOrder = order ? order.filter(o => o && o !== '') : featuredThemeNames;
      }
    }
  } catch(e) {
    console.log('Featured 로드 오류:', e);
  }

  const keyword = (document.getElementById('homeSearchInput').value || '').toLowerCase();
  const grid = document.getElementById('themeGrid');
  const filtered = themes.filter(t => {
  const regionMatch = currentRegions.length === 0 || currentRegions.includes(t.region);
const horrorMatch = currentHorrors.length === 0 || currentHorrors.includes(t.horror);
    const searchMatch = !keyword || t.name.toLowerCase().includes(keyword) || t.store.toLowerCase().includes(keyword);
    return regionMatch && horrorMatch && searchMatch;
  });

  // 최상단 고정 + 순서 변경
  const featured = filtered.filter(t => themeOrder.includes(t.name));
  const notFeatured = filtered.filter(t => !themeOrder.includes(t.name));
  
  featured.sort((a, b) => themeOrder.indexOf(a.name) - themeOrder.indexOf(b.name));
  
  // notFeatured를 매장명 ㄱㄴㄷ 순으로 정렬
  notFeatured.sort((a, b) => a.store.localeCompare(b.store, 'ko'));
  
  const sorted = [...featured, ...notFeatured];

  if (sorted.length === 0) {
    grid.innerHTML = '<div class="no-result">😶 해당 조건의 테마가 없어요</div>';
    return;
  }

  // 페이지네이션
  const THEMES_PER_PAGE = 12;
  const startIdx = (window.currentThemePage - 1) * THEMES_PER_PAGE;
  const endIdx = startIdx + THEMES_PER_PAGE;
  const paginatedThemes = sorted.slice(startIdx, endIdx);
  const totalPages = Math.ceil(sorted.length / THEMES_PER_PAGE);

  // 페이지 버튼
  let pageButtonsHtml = '';
  if (totalPages > 1) {
    pageButtonsHtml = `
      <div style="text-align: center; margin-top: 20px; padding: 20px 0; grid-column: 1 / -1;">
        <button onclick="goToThemePage(1)" style="padding: 6px 12px; margin: 0 8px 12px 8px; background-color: #1a0000; color: #ff0000; border: 1px solid #ff0000; border-radius: 6px; cursor: pointer; font-family: 'Noto Serif KR'; font-size: 0.85rem;">처음으로</button>
        <div style="margin: 12px 0;">
          <button onclick="goToThemePage(${window.currentThemePage - 1})" ${window.currentThemePage === 1 ? 'disabled style="opacity: 0.5;"' : ''} style="padding: 8px 16px; margin: 0 4px; background-color: #ff0000; color: white; border: none; border-radius: 6px; cursor: pointer; font-family: 'Noto Serif KR';">← 이전</button>
          <span style="margin: 0 16px; color: #888888;">페이지 ${window.currentThemePage} / ${totalPages}</span>
          <button onclick="goToThemePage(${window.currentThemePage + 1})" ${window.currentThemePage === totalPages ? 'disabled style="opacity: 0.5;"' : ''} style="padding: 8px 16px; margin: 0 4px; background-color: #ff0000; color: white; border: none; border-radius: 6px; cursor: pointer; font-family: 'Noto Serif KR';">다음 →</button>
        </div>
      </div>
    `;
  }

  grid.innerHTML = paginatedThemes.map(t => {
    const avg = ratings[t.name];
    const ratingHtml = avg
      ? `<div class="theme-rating">⭐ ${avg} / 5.0</div>`
      : `<div class="theme-rating" style="color:#555">아직 평점 없음</div>`;
    const hasRated = userRatings.has(t.name);
    const btnText = hasRated ? '이미 평점을 남겼어요' : '⭐ 평점 남기기';
    
    const isFeatured = themeOrder.includes(t.name);
    const featuredBadge = isFeatured ? `<div style="position: absolute; top: 8px; right: 8px; background-color: #ffaa00; color: #000000; padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; z-index: 10;">👑 스폰서</div>` : '';
    
    return `
      <div class="theme-card" onclick="openDetail('${t.name}')" style="${isFeatured ? 'border: 2px solid #ffaa00; box-shadow: 0 0 15px rgba(255, 170, 0, 0.3);' : 'border: 1px solid #2a0000;'} position: relative;">
        ${featuredBadge}
        <img src="${t.img}" alt="${t.name}">
        <div class="theme-card-body">
          <div class="theme-card-name">${t.name}</div>
          <div class="theme-card-store">${t.store}</div>
          <div class="theme-card-meta">
            <span class="theme-card-region">${t.region}</span>
            <span class="horror-level">${horrorDisplay(t.horror)}</span>
          </div>
          <div class="theme-card-price">💰 ${t.price || '가격 미정'}</div>
          ${ratingHtml}
          <a class="reserve-btn" href="${t.url}" target="_blank" onclick="event.stopPropagation()">예약하기</a>
          <button class="rating-btn" onclick="event.stopPropagation(); openRatingModal('${t.name}')" ${!currentUser || hasRated ? 'disabled' : ''}>${btnText}</button>
        </div>
      </div>
    `;
  }).join('') + pageButtonsHtml;
}

    window.setFilter = function(type, value, btn) {
  if (value === '전체') {
    if (type === 'region') {
      currentRegions = [];
    } else {
      currentHorrors = [];
    }
  } else {
    if (type === 'region') {
      const index = currentRegions.indexOf(value);
      if (index > -1) {
        currentRegions.splice(index, 1);
      } else {
        currentRegions.push(value);
      }
    } else {
      const horrorVal = parseFloat(value);
      const index = currentHorrors.findIndex(h => parseFloat(h) === horrorVal);
      if (index > -1) {
        currentHorrors.splice(index, 1);
      } else {
        currentHorrors.push(horrorVal);
      }
    }
  }
  
  refreshFilterUI();
  updateActiveFilters();
  window.currentThemePage = 1;
  renderThemes();
}

function refreshFilterUI() {
  // 지역 필터 버튼
  document.querySelectorAll('#regionFilter .filter-btn').forEach(b => {
    const region = b.textContent.trim();
    if (region === '전체') {
      if (currentRegions.length === 0) {
        b.classList.add('active');
      } else {
        b.classList.remove('active');
      }
    } else {
      if (currentRegions.includes(region)) {
        b.classList.add('active');
      } else {
        b.classList.remove('active');
      }
    }
  });
  
  // 공포도 필터 버튼
  document.querySelectorAll('#horrorFilter .filter-btn').forEach(b => {
    const label = b.textContent.trim();
    
    if (label === '전체') {
      if (currentHorrors.length === 0) {
        b.classList.add('active');
      } else {
        b.classList.remove('active');
      }
    } else {
      // 버튼 텍스트에서 숫자 추출 (💀 제거)
      const horrorText = label.replace(/💀/g, '').trim();
      const horror = parseFloat(horrorText);
      
      if (!isNaN(horror) && currentHorrors.some(h => parseFloat(h) === horror)) {
        b.classList.add('active');
      } else {
        b.classList.remove('active');
      }
    }
  });
}

    function drawChart(canvasId, label, labels, data, color) {
      const ctx = document.getElementById(canvasId).getContext('2d');
      
      if (charts[canvasId]) {
        charts[canvasId].destroy();
      }

      charts[canvasId] = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: label,
            data: data,
            backgroundColor: color,
            borderColor: color,
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              max: Math.max(...data) + 1,
              ticks: {
                stepSize: 1,
                color: '#888888'
              },
              grid: {
                color: '#1a0000'
              }
            },
            x: {
              ticks: {
                color: '#888888',
                font: {
                  size: 11
                }
              },
              grid: {
                display: false
              }
            }
          }
        }
      });
    }

    function clearCharts() {
      Object.keys(charts).forEach(key => {
        if (charts[key]) {
          charts[key].destroy();
          delete charts[key];
        }
      });
    }

    window.closeDetail = function() {
      clearCharts();
      document.getElementById('detailModal').classList.remove('active');
    }

    window.closeDetailOutside = function(event) {
      if (event.target === document.getElementById('detailModal')) closeDetail();
    }

const sortedTop10 = sorted.slice(0, 10);

// 캐러셀 렌더링
function renderEventCarousel() {
  const track = document.getElementById('eventCarouselTrack');
  
  if (!track || allEvents.length === 0) {
    if (track) track.innerHTML = '<div style="color: #666666; padding: 20px; width: 100%;">등록된 이벤트가 없습니다</div>';
    return;
  }

  track.innerHTML = allEvents.map(event => `
    <div class="event-carousel-item" onclick="openEventDetail('${event.id}')">
      <img src="${event.image}" alt="${event.title}" onerror="this.src='https://via.placeholder.com/1600x900'">
      <div class="event-carousel-overlay">
        <div class="event-carousel-title">${event.title}</div>
      </div>
    </div>
  `).join('');

  updateCarouselPagination();
}

// 페이지네이션 업데이트
function updateCarouselPagination() {
  const pagination = document.getElementById('eventCarouselPagination');
  if (pagination && allEvents.length > 0) {
    pagination.textContent = `${eventCarouselIndex + 1}/${allEvents.length}`;
  }
}

// 캐러셀 슬라이드
function slideEventCarousel(direction) {
  const track = document.getElementById('eventCarouselTrack');
  if (!track || allEvents.length === 0) return;
  
  eventCarouselIndex = Math.max(0, Math.min(allEvents.length - 1, eventCarouselIndex + direction));
  track.style.transform = `translateX(${-eventCarouselIndex * 100}%)`;
  updateCarouselPagination();
}

// 키보드/스와이프 이벤트
window.addEventListener('DOMContentLoaded', function() {
  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft') slideEventCarousel(-1);
    if (e.key === 'ArrowRight') slideEventCarousel(1);
  });

  let touchStartX = 0;
  const track = document.getElementById('eventCarouselTrack');
  
  if (track) {
    track.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
    });

    track.addEventListener('touchend', e => {
      const touchEndX = e.changedTouches[0].clientX;
      if (touchStartX - touchEndX > 50) slideEventCarousel(1);
      if (touchEndX - touchStartX > 50) slideEventCarousel(-1);
    });
  }
});

  const container = document.getElementById('eventCommentsList');
  
  if (allEventComments.length === 0) {
    container.innerHTML = '<div style="text-align: center; color: #666666; padding: 20px;">댓글이 없습니다</div>';
    return;
  }

  container.innerHTML = allEventComments
    .sort((a, b) => {
      const dateA = typeof a.createdAt === 'string' ? new Date(a.createdAt) : a.createdAt;
      const dateB = typeof b.createdAt === 'string' ? new Date(b.createdAt) : b.createdAt;
      return dateB - dateA;
    })
    .map(comment => {
      const dateObj = typeof comment.createdAt === 'string' ? new Date(comment.createdAt) : comment.createdAt;
      const date = dateObj.toLocaleDateString('ko-KR');
      return `
        <div style="background-color: #1a0000; border: 1px solid #2a0000; border-radius: 8px; padding: 12px; margin-bottom: 8px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <div style="color: #ff6666; font-weight: 700; font-size: 0.9rem;">${comment.userName}</div>
            <div style="color: #666666; font-size: 0.75rem;">📅 ${date}</div>
          </div>
          <div style="color: #aaaaaa; font-size: 0.9rem; line-height: 1.4; margin-bottom: 8px;">${comment.content.replace(/\n/g, '<br>')}</div>

          ${currentUser && currentUser.uid === comment.userId ? `
            <button onclick="deleteEventComment('${comment.id}')" style="padding: 4px 8px; background-color: #ff0000; border: none; border-radius: 4px; color: #ffffff; font-size: 0.75rem; cursor: pointer;">삭제</button>
          ` : ''}
        </div>
      `;
    }).join('');
}

// 댓글 작성
window.submitEventComment = async function(eventId) {
  if (!currentUser) {
    alert('로그인이 필요합니다');
    return;
  }

  const input = document.getElementById('eventCommentInput');
  const content = input.value.trim();

  if (!content) {
    alert('댓글을 입력해주세요');
    return;
  }

  try {
    await addDoc(collection(db, 'eventComments'), {
      eventId: eventId,
      userId: currentUser.uid,
      userName: userProfile.nickname || currentUser.displayName,
      content: content,
      createdAt: new Date().toISOString()
    });
    
    input.value = '';
    alert('댓글이 등록되었습니다');
    await loadEventComments(eventId);
  } catch(e) {
    console.error('댓글 저장 오류:', e);
    alert('댓글 등록에 실패했습니다');
  }
}

// 댓글 삭제
window.deleteEventComment = async function(commentId) {
  if (!confirm('댓글을 삭제하시겠습니까?')) return;

  try {
    await deleteDoc(doc(db, 'eventComments', commentId));
    alert('댓글이 삭제되었습니다');
    const eventId = new URLSearchParams(window.location.search).get('eventId');
    if (eventId) await loadEventComments(eventId);
  } catch(e) {
    console.error('댓글 삭제 오류:', e);
    alert('삭제에 실패했습니다');
  }
}

// backToCommunity 수정 (이미 있으면 아래로 교체)
window.backToCommunity = function() {
  currentViewTheme = null;
  document.getElementById('communityView').style.display = 'block';
  document.getElementById('themePostView').style.display = 'none';
  document.getElementById('eventDetailView').classList.remove('active');
  renderCommunityList();
}
// 페이지 완전히 로드된 후 실행
async function initializeGongteguide() {
  try {
    await loadRatings();
    await loadAnnouncements();
    await loadEvents();
    await loadSponsorSettings();
    
    // 모든 로드 완료 후 로딩 화면 숨기기
    const loadingScreen = document.getElementById('loadingScreen');
    if (loadingScreen) {
      loadingScreen.style.display = 'none';
    }
  } catch(e) {
    console.error('로드 오류:', e);
    // 오류 발생해도 로딩 화면 숨기기
    const loadingScreen = document.getElementById('loadingScreen');
    if (loadingScreen) {
      loadingScreen.style.display = 'none';
    }
  }
}

// 페이지 로드 완료 후 실행
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initializeGongteguide);
} else {
  initializeGongteguide();
}
  </script>
