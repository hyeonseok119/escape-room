<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공테가이드</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #0a0a0a;
      color: #e0e0e0;
      font-family: 'Noto Serif KR', serif;
      padding-bottom: 44px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0;
      width: 100%;
      background-color: #0f0000;
      border-top: 1px solid #3a0000;
      display: flex;
      z-index: 998;
    }

    .nav-tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 0;
      cursor: pointer;
      transition: background-color 0.2s;
      border: none;
      background: none;
      font-family: 'Noto Serif KR', serif;
    }

    .nav-tab:hover { background-color: #1a0000; }
    .nav-tab.active { background-color: #1a0000; }

    .tab-label {
      font-size: 0.65rem;
      color: #666666;
    }

    .nav-tab.active .tab-label { color: #ff0000; }

    .page { display: none; }
    .page.active { display: block; }

    .coming-soon {
      text-align: center;
      padding: 100px 20px;
      color: #444444;
    }

    .coming-soon .icon { font-size: 3rem; margin-bottom: 16px; }
    .coming-soon h2 { font-size: 1.2rem; color: #666666; margin-bottom: 8px; }
    .coming-soon p { font-size: 0.85rem; }

    .sponsor-bar {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      background-color: #1a0000;
      border-bottom: 1px solid #ff0000;
      text-align: center;
      padding: 8px;
      font-size: 0.85rem;
      color: #ff6666;
      z-index: 999;
    }

    .hero {
      margin-top: 36px;
      padding: 60px 16px 40px;
      text-align: center;
      background: linear-gradient(180deg, #1a0000 0%, #0a0a0a 100%);
      border-bottom: 1px solid #3a0000;
      position: relative;
    }

    .hero-subtitle {
      font-size: 0.85rem;
      letter-spacing: 6px;
      color: #ff0000;
      margin-bottom: 16px;
    }

    .hero-title {
      font-size: 3rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 20px #ff000088, 0 0 40px #ff000044;
      letter-spacing: 4px;
    }

    .hero-title span { color: #ff0000; }

    .hero-desc {
      margin-top: 16px;
      font-size: 0.9rem;
      color: #888888;
      letter-spacing: 2px;
    }

    .search-icon-btn {
      position: absolute;
      top: 20px; right: 20px;
      background: none;
      border: 1px solid #3a0000;
      border-radius: 50%;
      width: 38px; height: 38px;
      cursor: pointer;
      font-size: 1.1rem;
      color: #ff6666;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }

    .search-icon-btn:hover { background-color: #1a0000; }

    .search-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .search-overlay.active { display: flex; }

    .search-box {
      width: 90%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-box input {
      width: 100%;
      padding: 16px 20px;
      background-color: #1a0000;
      border: 1px solid #ff0000;
      border-radius: 8px;
      color: #ffffff;
      font-size: 1.1rem;
      font-family: 'Noto Serif KR', serif;
      outline: none;
    }

    .search-box input::placeholder { color: #666666; }

    .search-close {
      align-self: flex-end;
      background: none;
      border: none;
      color: #888888;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: 'Noto Serif KR', serif;
    }

    .filter-section {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px 16px 0;
    }

    .filter-toggle-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .filter-toggle-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: 1px solid #3a0000;
      border-radius: 20px;
      background-color: #1a0000;
      color: #aaaaaa;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Noto Serif KR', serif;
    }

    .filter-toggle-btn.open {
      background-color: #ff0000;
      border-color: #ff0000;
      color: #ffffff;
    }

    .filter-toggle-btn .arrow {
      font-size: 0.7rem;
      transition: transform 0.2s;
    }

    .filter-toggle-btn.open .arrow { transform: rotate(180deg); }

    .filter-dropdown {
      display: none;
      background-color: #111111;
      border: 1px solid #2a0000;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .filter-dropdown.open { display: block; }

    .filter-options { display: flex; flex-wrap: wrap; gap: 8px; }

    .filter-btn {
      padding: 6px 14px;
      border: 1px solid #3a0000;
      border-radius: 20px;
      background-color: #1a0000;
      color: #aaaaaa;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Noto Serif KR', serif;
    }

    .filter-btn:hover, .filter-btn.active {
      background-color: #ff0000;
      border-color: #ff0000;
      color: #ffffff;
    }

    .active-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .active-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background-color: #2a0000;
      border: 1px solid #ff0000;
      border-radius: 20px;
      font-size: 0.78rem;
      color: #ff6666;
    }

    .active-tag button {
      background: none;
      border: none;
      color: #ff6666;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0;
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 16px 20px;
    }

    @media (min-width: 600px) { .theme-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 900px) { .theme-grid { grid-template-columns: repeat(4, 1fr); } }

    .theme-card {
      background-color: #111111;
      border: 1px solid #2a0000;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }

    .theme-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(255,0,0,0.3);
      border-color: #ff0000;
    }

    .theme-card img { width: 100%; height: 120px; object-fit: cover; }

    .theme-card-body {
      padding: 12px; flex: 1;
      display: flex; flex-direction: column; gap: 6px;
    }

    .theme-card-name { font-size: 0.9rem; font-weight: 700; color: #ffffff; }
    .theme-card-store { font-size: 0.75rem; color: #888888; }

    .theme-card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .theme-card-region {
      font-size: 0.72rem;
      background-color: #1a0000;
      color: #ff6666;
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid #3a0000;
    }

    .horror-level { font-size: 0.75rem; color: #ff4444; }
    .theme-card-price { font-size: 0.78rem; color: #aaaaaa; }
    .theme-rating { font-size: 0.82rem; color: #ffaa00; }

    .reserve-btn {
      display: block;
      margin-top: 6px;
      padding: 8px;
      background-color: #1a0000;
      border: 1px solid #ff0000;
      border-radius: 6px;
      color: #ff0000;
      text-align: center;
      font-size: 0.82rem;
      text-decoration: none;
      transition: background-color 0.2s, color 0.2s;
      font-family: 'Noto Serif KR', serif;
    }

    .reserve-btn:hover { background-color: #ff0000; color: #ffffff; }

    .rating-btn {
      display: block;
      margin-top: 4px;
      padding: 8px;
      background-color: #111111;
      border: 1px solid #ffaa00;
      border-radius: 6px;
      color: #ffaa00;
      text-align: center;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
      font-family: 'Noto Serif KR', serif;
    }

    .rating-btn:hover { background-color: #ffaa00; color: #000000; }

    .no-result {
      grid-column: 1 / -1;
      text-align: center;
      color: #555555;
      padding: 60px 0;
      font-size: 0.9rem;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: #111111;
      border: 1px solid #ff0000;
      border-radius: 16px;
      padding: 28px 24px;
      width: 90%;
      max-width: 440px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ff0000;
      margin-bottom: 20px;
      text-align: center;
    }

    .question-group { margin-bottom: 20px; }

    .question-label {
      font-size: 0.85rem;
      color: #cccccc;
      margin-bottom: 10px;
    }

    .star-row { display: flex; gap: 8px; }

    .star {
      font-size: 1.6rem;
      cursor: pointer;
      color: #444444;
      transition: color 0.15s;
    }

    .star.active { color: #ffaa00; }

    .question-options { display: flex; flex-wrap: wrap; gap: 8px; }

    .option-btn {
      padding: 6px 14px;
      border: 1px solid #3a0000;
      border-radius: 20px;
      background-color: #1a0000;
      color: #aaaaaa;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Noto Serif KR', serif;
    }

    .option-btn.selected {
      background-color: #ff0000;
      border-color: #ff0000;
      color: #ffffff;
    }

    .modal-submit {
      width: 100%;
      padding: 12px;
      background-color: #ff0000;
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Noto Serif KR', serif;
      margin-top: 8px;
      transition: background-color 0.2s;
    }

    .modal-submit:hover { background-color: #cc0000; }

    .modal-close-btn {
      width: 100%;
      padding: 10px;
      background: none;
      border: 1px solid #333333;
      border-radius: 8px;
      color: #888888;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: 'Noto Serif KR', serif;
      margin-top: 8px;
    }

    /* 마이페이지 프로필 스타일 추가 */
    .profile-card {
      background-color: #111;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      margin: 20px 16px;
      text-align: center;
    }
    .profile-img {
      width: 60px; height: 60px;
      border-radius: 50%;
      margin-bottom: 10px;
      border: 2px solid #ff0000;
    }
    .nickname-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 10px;
    }
    .nickname-input {
      background: #1a0000;
      border: 1px solid #ff0000;
      color: #fff;
      padding: 5px 10px;
      border-radius: 4px;
      font-family: 'Noto Serif KR', serif;
    }
    .my-rating-list { padding: 0 16px; }
    .my-rating-card {
      background: #1a0000;
      border-left: 4px solid #ff0000;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="sponsor-bar">📢 이 자리는 스폰서 광고 배너입니다</div>

  <div class="page active" id="page-home">
    <div class="hero">
      <button class="search-icon-btn" onclick="openSearch()">🔍</button>
      <div class="hero-subtitle">— HORROR THEME GUIDE —</div>
      <div class="hero-title">공<span>테</span>가이드</div>
      <div class="hero-desc">당신이 두려워할 공포 방탈출 테마를 찾아드립니다</div>
    </div>

    <div class="search-overlay" id="searchOverlay" onclick="closeSearchOutside(event)">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="테마명 또는 매장명 검색..." oninput="renderThemes()">
        <button class="search-close" onclick="closeSearch()">✕ 닫기</button>
      </div>
    </div>

    <div class="filter-section">
      <div class="filter-toggle-row">
        <button class="filter-toggle-btn" id="regionToggle" onclick="toggleFilter('region')">
          📍 지역 <span class="arrow">▼</span>
        </button>
        <button class="filter-toggle-btn" id="horrorToggle" onclick="toggleFilter('horror')">
          👻 공포도 <span class="arrow">▼</span>
        </button>
      </div>
      <div class="filter-dropdown" id="regionDropdown">
        <div class="filter-options" id="regionFilter">
          <button class="filter-btn active" onclick="setFilter('region','전체',this)">전체</button>
          <button class="filter-btn" onclick="setFilter('region','강남',this)">강남</button>
          <button class="filter-btn" onclick="setFilter('region','홍대',this)">홍대</button>
          <button class="filter-btn" onclick="setFilter('region','건대',this)">건대</button>
          <button class="filter-btn" onclick="setFilter('region','대학로',this)">대학로</button>
          <button class="filter-btn" onclick="setFilter('region','잠실',this)">잠실</button>
          <button class="filter-btn" onclick="setFilter('region','신촌',this)">신촌</button>
          <button class="filter-btn" onclick="setFilter('region','신림',this)">신림</button>
          <button class="filter-btn" onclick="setFilter('region','인천',this)">인천</button>
          <button class="filter-btn" onclick="setFilter('region','수원',this)">수원</button>
          <button class="filter-btn" onclick="setFilter('region','안산',this)">안산</button>
          <button class="filter-btn" onclick="setFilter('region','안양',this)">안양</button>
        </div>
      </div>
      <div class="filter-dropdown" id="horrorDropdown">
        <div class="filter-options" id="horrorFilter">
          <button class="filter-btn active" onclick="setFilter('horror','전체',this)">전체</button>
          <button class="filter-btn" onclick="setFilter('horror',1,this)">💀 1</button>
          <button class="filter-btn" onclick="setFilter('horror',1.5,this)">💀 1.5</button>
          <button class="filter-btn" onclick="setFilter('horror',2,this)">💀💀 2</button>
          <button class="filter-btn" onclick="setFilter('horror',2.5,this)">💀💀 2.5</button>
          <button class="filter-btn" onclick="setFilter('horror',3,this)">💀💀💀 3</button>
          <button class="filter-btn" onclick="setFilter('horror',3.5,this)">💀💀💀 3.5</button>
          <button class="filter-btn" onclick="setFilter('horror',4,this)">💀💀💀💀 4</button>
          <button class="filter-btn" onclick="setFilter('horror',4.5,this)">💀💀💀💀 4.5</button>
          <button class="filter-btn" onclick="setFilter('horror',5,this)">💀💀💀💀💀 5</button>
        </div>
      </div>
      <div class="active-filters" id="activeFilters"></div>
    </div>

    <div class="theme-grid" id="themeGrid"></div>
  </div>

  <div class="page" id="page-community">
    <div class="coming-soon">
      <div class="icon">💬</div>
      <h2>커뮤니티</h2>
      <p>테마 후기 게시판이 곧 열립니다</p>
    </div>
  </div>

  <div class="page" id="page-ranking">
    <div class="coming-soon">
      <div class="icon">🏆</div>
      <h2>랭킹</h2>
      <p>평점 랭킹이 곧 열립니다</p>
    </div>
  </div>

  <div class="page" id="page-mypage">
    <div id="mypage-content">
      <div class="coming-soon">
        <div class="icon">👤</div>
        <h2>마이페이지</h2>
        <p>로그인 후 이용할 수 있습니다</p>
        <button class="modal-submit" onclick="login()" style="width:200px; margin-top:20px;">구글 로그인</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-tab active" onclick="switchTab('home', this)">
      <span class="tab-label">홈</span>
    </button>
    <button class="nav-tab" onclick="switchTab('community', this)">
      <span class="tab-label">커뮤니티</span>
    </button>
    <button class="nav-tab" onclick="switchTab('ranking', this)">
      <span class="tab-label">랭킹</span>
    </button>
    <button class="nav-tab" onclick="switchTab('mypage', this)">
      <span class="tab-label">마이페이지</span>
    </button>
  </nav>

  <div class="modal-overlay" id="ratingModal" onclick="closeModalOutside(event)">
    <div class="modal">
      <div class="modal-title" id="modalThemeName"></div>
      <div class="question-group">
        <div class="question-label">⭐ 전체 만족도</div>
        <div class="star-row" id="starRow">
          <span class="star" onclick="setStar(1)">★</span>
          <span class="star" onclick="setStar(2)">★</span>
          <span class="star" onclick="setStar(3)">★</span>
          <span class="star" onclick="setStar(4)">★</span>
          <span class="star" onclick="setStar(5)">★</span>
        </div>
      </div>
      <div class="question-group">
        <div class="question-label">👻 실제 공포도는 어땠나요?</div>
        <div class="question-options" id="q_horror">
          <button class="option-btn" onclick="selectOption('q_horror','별로 안 무서움')">별로 안 무서움</button>
          <button class="option-btn" onclick="selectOption('q_horror','적당히 무서움')">적당히 무서움</button>
          <button class="option-btn" onclick="selectOption('q_horror','많이 무서움')">많이 무서움</button>
          <button class="option-btn" onclick="selectOption('q_horror','극한의 공포')">극한의 공포</button>
        </div>
      </div>
      <div class="question-group">
        <div class="question-label">🧩 문제 난이도는?</div>
        <div class="question-options" id="q_difficulty">
          <button class="option-btn" onclick="selectOption('q_difficulty','쉬움')">쉬움</button>
          <button class="option-btn" onclick="selectOption('q_difficulty','보통')">보통</button>
          <button class="option-btn" onclick="selectOption('q_difficulty','어려움')">어려움</button>
          <button class="option-btn" onclick="selectOption('q_difficulty','매우 어려움')">매우 어려움</button>
        </div>
      </div>
      <div class="question-group">
        <div class="question-label">👥 몇 명이서 했나요?</div>
        <div class="question-options" id="q_members">
          <button class="option-btn" onclick="selectOption('q_members','1인')">1인</button>
          <button class="option-btn" onclick="selectOption('q_members','2인')">2인</button>
          <button class="option-btn" onclick="selectOption('q_members','3인')">3인</button>
          <button class="option-btn" onclick="selectOption('q_members','4인 이상')">4인 이상</button>
        </div>
      </div>
      <div class="question-group">
        <div class="question-label">🏆 탈출 성공 여부</div>
        <div class="question-options" id="q_result">
          <button class="option-btn" onclick="selectOption('q_result','탈출 성공 🎉')">탈출 성공 🎉</button>
          <button class="option-btn" onclick="selectOption('q_result','탈출 실패 💀')">탈출 실패 💀</button>
        </div>
      </div>
      <button class="modal-submit" onclick="submitRating()">평점 등록하기</button>
      <button class="modal-close-btn" onclick="closeModal()">닫기</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, getDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDH698vreJanicluYtFSW31TgH6EWeGoLg",
      authDomain: "gongteguide.firebaseapp.com",
      projectId: "gongteguide",
      storageBucket: "gongteguide.firebasestorage.app",
      messagingSenderId: "1038963240281",
      appId: "1:1038963240281:web:75d7cd8cdf90d736657048"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const themes = [
      { name: '안산 코노', store: '꿈소풍 안산 1호점', region: '안산', horror: 3, price: '22,000원', img: 'https://dreampicnicescape.com/images/theme_ansan_coin.jpg', url: 'https://dreampicnicescape.com/reservation' },
      { name: '4F:마지막기록', store: '블랙헤이븐', region: '안양', horror: 3, price: '36,000원', img: 'https://naverbooking-phinf.pstatic.net/20260107_118/1767765334755BQIVB_PNG/4F_%C6%F7%BD%BA%C5%CD.png', url: 'https://naver.me/x4G63doR' },
      { name: '피안화', store: '플레이33 홍대점', region: '홍대', horror: 3.5, price: '34,000원', img: 'https://play33.kr/storage/theme/2026_04/08/zLbaL5XoQXS0iPpYNjAdvI1UDIjCAICv9Vkx1VmE.jpg', url: 'https://play33.kr/reservation?branch=4&theme' },
      { name: 'AYAKO', store: '후즈데어', region: '강남', horror: 3, price: '35,000원', img: 'https://search.pstatic.net/common/?src=https%3A%2F%2Fblogfiles.pstatic.net%2FMjAyNjAzMTlfMjEw%2FMDAxNzczODgzMTgzNjU0.Uk-003QLkBYQ9epaPvMC9lZdhlQSYkKb5sB_KQT1T8Ig.9pcPtPWfxITknEYPtJodGoFW9EMas6Vl2LVwCV4-m2Ug.JPEG%2F900%EF%BC%BFScreenshot%EF%BC%BF20260319%EF%BC%BF101703%EF%BC%BFInstagram.jpg%2F900x903', url: 'https://www.keyescape.com/reservation1.php?zizum_num=23&theme_num=71&theme_info_num=63' },
      { name: '나폴리탄', store: '둠이스케이프 1호점', region: '인천', horror: 5, price: '28,000원', img: 'https://doomescape.com/file/theme/29_3290704845.png', url: 'https://doomescape.com/layout/res/home.php?go=rev.make&s_zizum=1' },
      { name: '허수아비', store: '둠이스케이프 FEAR점', region: '수원', horror: 4, price: '31,000원', img: 'https://doomescape.com/file/theme/34_4437239922.png', url: 'https://doomescape.com/layout/res/home.php?go=rev.make&s_zizum=4' },
      { name: '생존자', store: '넥스트에디션 건대2호점', region: '건대', horror: 1, price: '29,000원', img: 'https://search.pstatic.net/common/?src=https%3A%2F%2Fnaverbooking-phinf.pstatic.net%2F20241126_87%2F17325572345753Uf9a_JPEG%2FKakaoTalk_Photo_2024-11-26-02-53-12.jpeg', url: 'https://map.naver.com/p/search/%EB%84%A5%EC%8A%A4%ED%8A%B8%EC%97%90%EB%94%94%EC%85%98/place/1163403341' },
      { name: '신촌성심병원', store: '나의신방', region: '신촌', horror: 2, price: '200,000원 (팀당)', img: 'https://xn--910bj3tlmfz4e.com/file/theme/7_a.jpg', url: 'https://xn--910bj3tlmfz4e.com/layout/res/home.php?go=rev.make&s_theme_num=7' },
      { name: 'STAGE', store: '에필로그', region: '대학로', horror: 3, price: '30,000원', img: 'https://epilogueescape.com/file/theme/3_a.jpg', url: 'https://epilogueescape.com/layout/res/home.php?go=rev.make&s_theme_num=3' },
      { name: '창귀', store: '체셔하우스', region: '신림', horror: 3, price: '25,000원', img: 'https://naverbooking-phinf.pstatic.net/20250813_71/1755024935361d6xMc_PNG/image.png', url: 'https://map.naver.com/p/entry/place/2043391014' },
    ];

    let currentRegion = '전체';
    let currentHorror = '전체';
    let ratings = {};
    let currentTheme = null;
    let currentStar = 0;
    let selectedOptions = {};
    let currentUser = null;

    // --- 로그인 관련 함수 ---
    window.login = async function() {
      try {
        await signInWithPopup(auth, provider);
      } catch (e) { console.error(e); }
    }

    window.logout = async function() {
      await signOut(auth);
      location.reload();
    }

    window.updateNickname = async function() {
      const newNick = document.getElementById('nickInput').value;
      if(!newNick) return alert('닉네임을 입력해주세요');
      await setDoc(doc(db, 'users', currentUser.uid), { nickname: newNick }, { merge: true });
      alert('닉네임이 변경되었습니다');
      renderMyPage();
    }

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      if (user) {
        await renderMyPage();
      }
      renderThemes();
    });

    // --- 마이페이지 렌더링 ---
    window.renderMyPage = async function() {
      const container = document.getElementById('mypage-content');
      if (!currentUser) return;

      // 닉네임 가져오기
      const userDoc = await getDoc(doc(db, 'users', currentUser.uid));
      const nickname = userDoc.exists() ? userDoc.data().nickname : currentUser.displayName;

      // 내가 쓴 평점 가져오기
      const q = query(collection(db, 'ratings'), where('uid', '==', currentUser.uid));
      const snap = await getDocs(q);
      
      let ratingsHtml = '';
      snap.forEach(d => {
        const data = d.data();
        ratingsHtml += `
          <div class="my-rating-card">
            <div style="font-weight:bold">${data.theme}</div>
            <div style="color:#ffaa00">⭐ ${data.star}점</div>
            <div style="font-size:0.75rem; color:#888">${data.horror} | ${data.result}</div>
          </div>
        `;
      });

      container.innerHTML = `
        <div class="profile-card">
          <img src="${currentUser.photoURL}" class="profile-img">
          <div style="font-size:1.1rem; font-weight:bold">${nickname}</div>
          <div class="nickname-row">
            <input type="text" id="nickInput" class="nickname-input" placeholder="새 닉네임">
            <button onclick="updateNickname()" class="option-btn" style="border-color:#ff0000; color:#ff0000">변경</button>
          </div>
          <button onclick="logout()" style="background:none; border:none; color:#555; margin-top:15px; cursor:pointer; font-size:0.8rem">로그아웃</button>
        </div>
        <div class="my-rating-list">
          <h3 style="margin-bottom:15px; color:#ff0000; font-size:1rem">내가 남긴 평점 목록</h3>
          ${ratingsHtml || '<p style="color:#444; text-align:center">아직 남긴 평점이 없습니다.</p>'}
        </div>
      `;
    }

    async function loadRatings() {
      const snapshot = await getDocs(collection(db, 'ratings'));
      const temp = {};
      snapshot.forEach(doc => {
        const d = doc.data();
        if (!temp[d.theme]) temp[d.theme] = [];
        temp[d.theme].push(d.star);
      });
      Object.keys(temp).forEach(k => {
        const arr = temp[k];
        ratings[k] = (arr.reduce((a,b) => a+b, 0) / arr.length).toFixed(1);
      });
      renderThemes();
    }

    function horrorDisplay(level) {
      const full = Math.floor(level);
      const half = level % 1 !== 0;
      return '💀'.repeat(full) + (half ? '👻' : '') + ` ${level}`;
    }

    function updateActiveFilters() {
      const container = document.getElementById('activeFilters');
      let html = '';
      if (currentRegion !== '전체') html += `<div class="active-tag">📍 ${currentRegion} <button onclick="clearFilter('region')">✕</button></div>`;
      if (currentHorror !== '전체') html += `<div class="active-tag">👻 공포도 ${currentHorror} <button onclick="clearFilter('horror')">✕</button></div>`;
      container.innerHTML = html;
    }

    window.clearFilter = function(type) {
      if (type === 'region') {
        currentRegion = '전체';
        document.querySelectorAll('#regionFilter .filter-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('#regionFilter .filter-btn').classList.add('active');
      } else {
        currentHorror = '전체';
        document.querySelectorAll('#horrorFilter .filter-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('#horrorFilter .filter-btn').classList.add('active');
      }
      updateActiveFilters();
      renderThemes();
    }

    window.toggleFilter = function(type) {
      const dropdown = document.getElementById(type + 'Dropdown');
      const toggle = document.getElementById(type + 'Toggle');
      const isOpen = dropdown.classList.contains('open');
      document.querySelectorAll('.filter-dropdown').forEach(d => d.classList.remove('open'));
      document.querySelectorAll('.filter-toggle-btn').forEach(b => b.classList.remove('open'));
      if (!isOpen) {
        dropdown.classList.add('open');
        toggle.classList.add('open');
      }
    }

    window.switchTab = function(tab, btn) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
      document.getElementById('page-' + tab).classList.add('active');
      btn.classList.add('active');
      document.querySelector('.sponsor-bar').style.display = tab === 'home' ? 'block' : 'none';
      if(tab === 'mypage') renderMyPage();
    }

    window.renderThemes = function() {
      const keyword = (document.getElementById('searchInput').value || '').toLowerCase();
      const grid = document.getElementById('themeGrid');
      const filtered = themes.filter(t => {
        const regionMatch = currentRegion === '전체' || t.region === currentRegion;
        const horrorMatch = currentHorror === '전체' || t.horror === currentHorror;
        const searchMatch = !keyword || t.name.toLowerCase().includes(keyword) || t.store.toLowerCase().includes(keyword);
        return regionMatch && horrorMatch && searchMatch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="no-result">😶 해당 조건의 테마가 없어요</div>';
        return;
      }

      grid.innerHTML = filtered.map(t => {
        const avg = ratings[t.name];
        const ratingHtml = avg
          ? `<div class="theme-rating">⭐ ${avg} / 5.0</div>`
          : `<div class="theme-rating" style="color:#555">아직 평점 없음</div>`;
        return `
          <div class="theme-card">
            <img src="${t.img}" alt="${t.name}">
            <div class="theme-card-body">
              <div class="theme-card-name">${t.name}</div>
              <div class="theme-card-store">${t.store}</div>
              <div class="theme-card-meta">
                <span class="theme-card-region">${t.region}</span>
                <span class="horror-level">${horrorDisplay(t.horror)}</span>
              </div>
              <div class="theme-card-price">💰 ${t.price || '가격 미정'}</div>
              ${ratingHtml}
              <a class="reserve-btn" href="${t.url}" target="_blank">예약하기</a>
              <button class="rating-btn" onclick="openRatingModal('${t.name}')">⭐ 평점 남기기</button>
            </div>
          </div>
        `;
      }).join('');
    }

    window.setFilter = function(type, value, btn) {
      if (type === 'region') {
        currentRegion = value;
        document.querySelectorAll('#regionFilter .filter-btn').forEach(b => b.classList.remove('active'));
      } else {
        currentHorror = value;
        document.querySelectorAll('#horrorFilter .filter-btn').forEach(b => b.classList.remove('active'));
      }
      btn.classList.add('active');
      updateActiveFilters();
      renderThemes();
      toggleFilter(type);
    }

    window.openSearch = function() {
      document.getElementById('searchOverlay').classList.add('active');
      document.getElementById('searchInput').focus();
    }

    window.closeSearch = function() {
      document.getElementById('searchOverlay').classList.remove('active');
    }

    window.closeSearchOutside = function(event) {
      if (event.target === document.getElementById('searchOverlay')) closeSearch();
    }

    window.openRatingModal = function(themeName) {
      if(!currentUser) return alert('로그인 후 평점을 남길 수 있습니다.');
      currentTheme = themeName;
      currentStar = 0;
      selectedOptions = {};
      document.getElementById('modalThemeName').textContent = `⭐ ${themeName} 평점 남기기`;
      document.querySelectorAll('.star').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
      document.getElementById('ratingModal').classList.add('active');
    }

    window.closeModal = function() {
      document.getElementById('ratingModal').classList.remove('active');
    }

    window.closeModalOutside = function(event) {
      if (event.target === document.getElementById('ratingModal')) closeModal();
    }

    window.setStar = function(n) {
      currentStar = n;
      document.querySelectorAll('.star').forEach((s, i) => {
        s.classList.toggle('active', i < n);
      });
    }

    window.selectOption = function(groupId, value) {
      selectedOptions[groupId] = value;
      document.querySelectorAll(`#${groupId} .option-btn`).forEach(b => {
        b.classList.toggle('selected', b.textContent === value);
      });
    }

    window.submitRating = async function() {
      if (!currentUser) return alert('로그인이 필요합니다!');
      if (!currentStar) return alert('별점을 선택해주세요!');
      if (!selectedOptions['q_horror']) return alert('실제 공포도를 선택해주세요!');
      if (!selectedOptions['q_difficulty']) return alert('문제 난이도를 선택해주세요!');
      if (!selectedOptions['q_members']) return alert('인원을 선택해주세요!');
      if (!selectedOptions['q_result']) return alert('탈출 성공 여부를 선택해주세요!');

      try {
        // 중복 등록 방지 핵심: 문서 ID를 '사용자UID_테마명'으로 고정
        const docId = `${currentUser.uid}_${currentTheme}`;
        await setDoc(doc(db, 'ratings', docId), {
          uid: currentUser.uid,
          theme: currentTheme,
          star: currentStar,
          horror: selectedOptions['q_horror'],
          difficulty: selectedOptions['q_difficulty'],
          members: selectedOptions['q_members'],
          result: selectedOptions['q_result'],
          createdAt: new Date()
        });
        alert('평점이 등록됐어요! 감사합니다 😊');
        closeModal();
        await loadRatings();
      } catch(e) {
        alert('오류가 발생했어요. 다시 시도해주세요.');
        console.error(e);
      }
    }

    loadRatings();
  </script>

</body>
</html>
